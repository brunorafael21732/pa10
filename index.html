
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doações Solidárias</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5f2;
    color: #222;
    padding: 20px;
    transition: 0.3s;
}

header {
    background: #247a4b;
    color: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
}

main {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
}

input, button {
    padding: 12px;
    margin: 8px 0;
    width: 100%;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    background: #247a4b;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #185c36;
}

.doacao {
    background: #e5f4e9;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
}

.alto-contraste {
    background: black;
    color: yellow;
}

.alto-contraste main,
.alto-contraste .doacao {
    background: #222;
    color: yellow;
}

.alto-contraste header {
    background: black;
    border: 2px solid yellow;
}
</style>
</head>

<body>

<header>
    <h1>Doações Solidárias ❤️</h1>
    <p>Ajude quem precisa. Sua doação transforma vidas!</p>
</header>

<main>

    <h2>Acessibilidade</h2>

    <button onclick="alternarContraste()">
        Ativar ou desativar alto contraste
    </button>

    <button onclick="alterarFonte(2)">
        Aumentar fonte
    </button>

    <button onclick="alterarFonte(-2)">
        Diminuir fonte
    </button>

    <h2>Cadastre uma doação</h2>

    <form id="formulario">
        <label for="item">Nome do item:</label>
        <input id="item" type="text"
        placeholder="Ex: Cesta básica" required>

        <label for="descricao">Descrição:</label>
        <input id="descricao" type="text"
        placeholder="Descreva a doação" required>

        <button type="submit">Cadastrar doação</button>
    </form>

    <h2>Doações disponíveis</h2>

    <div id="lista">
        <p>Nenhuma doação cadastrada ainda.</p>
    </div>

</main>

<script>
let tamanhoFonte = 16;

function alternarContraste() {
    document.body.classList.toggle("alto-contraste");
}

function alterarFonte(valor) {
    tamanhoFonte += valor;
    tamanhoFonte = Math.max(12, Math.min(28, tamanhoFonte));
    document.body.style.fontSize = tamanhoFonte + "px";
}

document.getElementById("formulario")
.addEventListener("submit", function(event) {
    event.preventDefault();

    const item = document.getElementById("item").value.trim();
    const descricao = document.getElementById("descricao").value.trim();

    if (!item || !descricao) return;

    const mensagem = document.createElement("div");
    mensagem.className = "doacao";

    const titulo = document.createElement("strong");
    titulo.textContent = item;

    const texto = document.createElement("p");
    texto.textContent = descricao;

    mensagem.appendChild(titulo);
    mensagem.appendChild(texto);

    const lista = document.getElementById("lista");

    if (lista.querySelector("p")) {
        lista.innerHTML = "";
    }

    lista.appendChild(mensagem);

    this.reset();
});
</script>

</body>
</html>
